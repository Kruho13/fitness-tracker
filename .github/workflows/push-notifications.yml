name: Meal Reminders

on:
  schedule:
    - cron: '0 14 * * *'   # 9am CT (CDT) / breakfast
    - cron: '0 18 * * *'   # 1pm CT (CDT) / lunch
    - cron: '0 0 * * *'    # 7pm CT (CDT) / dinner
  workflow_dispatch:        # allow manual trigger for testing

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Determine meal from schedule
        id: meal
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "14" ]; then echo "meal=breakfast" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "18" ]; then echo "meal=lunch" >> $GITHUB_OUTPUT
          else echo "meal=dinner" >> $GITHUB_OUTPUT
          fi

      - name: Send push notification
        run: |
          curl -f -X GET \
            "${{ secrets.APP_URL }}/api/push/send?meal=${{ steps.meal.outputs.meal }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
